name: Update blog posts list

on:
  push:
    paths:
      - 'blog/*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build posts.js
        run: python3 .github/scripts/build_posts.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/posts.js
          git diff --cached --quiet || git commit -m "Update blog posts list"
          git push
