function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  if (model) {
    if (!easterEggActive) {
      // Normal spinning
      spinGroup.rotation.y += 0.04;

      if (hyperMode) {
        const swing = Math.sin(elapsed * 4) * 0.5;
        swingGroup.rotation.z = swing;
        swingGroup.position.y = Math.cos(elapsed * 8) * 0.4;
        spinGroup.rotation.y += 0.001;
      } else {
        swingGroup.rotation.z = 0;
        swingGroup.position.y = 0;
      }
    } else {
      spinGroup.rotation.y = Math.PI;
      swingGroup.rotation.set(0, 0, 0);
    }
  }

  const now = Date.now();
  if (hyperMode && (clickTimes.length === 0 || now - clickTimes[clickTimes.length - 1] > TIME_WINDOW)) {
    hyperMode = false;
  }

  animateCrowd(elapsed);
  renderer.render(scene, camera);
}



function animateCrowd(elapsed) {
  if (!personGroups || personGroups.length === 0) return;
if (hyperMode) {
  if (Math.random() < 0.03) {
    const person = personGroups[Math.floor(Math.random() * personGroups.length)];
    const emojiChar = emojiList[Math.floor(Math.random() * emojiList.length)];
    const sprite = createEmojiSprite(emojiChar);

    sprite.position.set(
      person.position.x + (Math.random() - 0.5) * 0.1,
      person.position.y + 0.8 + Math.random() * 0.2,
      person.position.z + (Math.random() - 0.5) * 0.1
    );

    emojiSprites.push({
      sprite,
      velocityY: Math.random() * 0.02 + 0.01,
      scaleUp: -1 * 0.001 + 0.003,
      swayOffset: Math.random() * Math.PI * 2
    });

    scene.add(sprite);
  }
}

for (let i = emojiSprites.length - 1; i >= 0; i--) {
  const e = emojiSprites[i];
  e.sprite.position.y += e.velocityY;
  e.sprite.position.x += Math.sin(clock.getElapsedTime() * 4 + e.swayOffset) * 0.001;
  e.sprite.scale.x += e.scaleUp;
  e.sprite.scale.y += e.scaleUp;
  e.sprite.material.opacity = Math.max(0, e.sprite.material.opacity - 0.01);

  if (e.sprite.material.opacity <= 0) {
    scene.remove(e.sprite);
    emojiSprites.splice(i, 1);
  }
}

  personGroups.forEach((personGroup) => {
    personGroup.position.y = Math.sin(elapsed * 3 + personGroup.userData.bobOffset) * 0.05;
  });
}


async function loadCrowdData(url) {
  const response = await fetch(url);
  const text = await response.text();
  const rows = text.split("\n").filter(r => r.trim() !== "");
  const headers = rows[0].split("\t").map(h => h.trim()); // Trim header spaces
  const data = rows.slice(1).map(row => {
    const cols = row.split("\t");
    const obj = {};
    headers.forEach((h, i) => obj[h] = cols[i] ? cols[i].trim() : "");
    return obj;
  });
  return data;
}

function createEmojiSprite(char) {
  const canvas = document.createElement("canvas");
  canvas.width = 128;
  canvas.height = 128;
  const ctx = canvas.getContext("2d");
  ctx.font = "100px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(char, 64, 64);
  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
  return new THREE.Sprite(material);
}

if (!userId) {
  isGuest = true;
  userId = "guest_" + Math.random().toString(36).substr(2, 9);
  localStorage.setItem("useridentifier", userId);
}

const thisVisitorRef = visitorsRef.child(userId);

function addOrUpdateVisitor(username = null) {
  thisVisitorRef.update({
    id: userId,
    guest: isGuest,
    username: username || userId,
    timestamp: firebase.database.ServerValue.TIMESTAMP
  }).catch(err => console.error("Failed to add/update visitor:", err));

  thisVisitorRef.onDisconnect().remove().catch(err => console.error("Failed to setup onDisconnect:", err));
}


firebase.database().ref('.info/connected').on('value', snap => {
  if (snap.val() === true) {
    if (!isGuest) {
      fetch(`https://mii-unsecure.ariankordi.net/miitomo_get_player_data/${userId}?namespace=own_mii`)
        .then(res => res.json())
        .then(data => {
          const player = data.players?.[0]?.player_data?.own_mii;
          const username = player?.nameExtension || userId;
          addOrUpdateVisitor(username);
        })
        .catch(err => {
          console.error("Failed to fetch username:", err);
          addOrUpdateVisitor();
        });
    } else {
      addOrUpdateVisitor();
    }
  }
});

setInterval(() => {
  thisVisitorRef.update({ timestamp: firebase.database.ServerValue.TIMESTAMP });
}, 10000);

visitorsRef.on('value', snapshot => {
  const now = Date.now();
  snapshot.forEach(childSnap => {
    const visitor = childSnap.val();
    if (visitor && visitor.timestamp && now - visitor.timestamp > 30000) {
      visitorsRef.child(visitor.id).remove();
    }
  });
});

function renderVisitors(snapshot) {
  visitorListDiv.innerHTML = "";

  const visitors = [];
  snapshot.forEach(childSnap => {
    const visitor = childSnap.val();
    if (visitor && visitor.id) visitors.push(visitor);
  });

  const clickPromises = visitors.map(visitor =>
    userClicksRef.child(visitor.id).get().then(snap => ({
      ...visitor,
      clicks: snap.val() || 0
    }))
  );

  Promise.all(clickPromises).then(visitorsWithClicks => {
    visitorsWithClicks.sort((a, b) => b.clicks - a.clicks);

    visitorsWithClicks.forEach((visitor, index) => {
      let visitorDiv = document.getElementById(`visitor-${visitor.id}`);
      if (!visitorDiv) {
        visitorDiv = document.createElement("div");
        visitorDiv.id = `visitor-${visitor.id}`;
        visitorDiv.style.display = "flex";
        visitorDiv.style.alignItems = "center";
        visitorDiv.style.marginBottom = "5px";
        visitorDiv.style.position = "relative";
        visitorDiv.style.zindex = 3;
        // Bubble container
        const bubbleLayer = document.createElement("div");
        bubbleLayer.className = "bubble-layer";
        bubbleLayer.style.position = "absolute";
        bubbleLayer.style.left = "60px";
        bubbleLayer.style.top = "-5px";
        visitorDiv.appendChild(bubbleLayer);

        visitorListDiv.appendChild(visitorDiv);
      } else {
        // Clear old info, but KEEP bubble layer
        Array.from(visitorDiv.children).forEach(child => {
          if (!child.classList.contains("bubble-layer")) {
            child.remove();
          }
        });
      }

      // Avatar + info again
      const img = document.createElement("img");
      img.width = 50;
      img.height = 50;
      img.style.borderRadius = "50%";
      img.style.marginRight = "8px";
      img.src = visitor.guest ? "anonface.png" : `https://tomop.kaeru.world/miiface/${visitor.id}`;
      img.onerror = () => { img.src = "anonface.png"; };

      const infoSpan = document.createElement("span");
      infoSpan.style.display = "flex";
      infoSpan.style.flexDirection = "column";

      const nameSpan = document.createElement("span");
      nameSpan.textContent = visitor.guest ? visitor.id : visitor.username || visitor.id;
      if (visitor.id === userId) {
        nameSpan.style.color = "white";
        nameSpan.style.fontWeight = "bold";
      }
      if (index === 0) nameSpan.textContent += " 👑";

      const clicksSpan = document.createElement("span");
      clicksSpan.textContent = `Clicks: ${visitor.clicks}`;
      clicksSpan.style.fontSize = "0.9em";
      clicksSpan.style.color = "#00ff00";

      userClicksRef.child(visitor.id).on("value", snap => {
        clicksSpan.textContent = `Clicks: ${snap.val() || 0}`;
      });

      infoSpan.appendChild(nameSpan);
      infoSpan.appendChild(clicksSpan);

      visitorDiv.appendChild(img);
      visitorDiv.appendChild(infoSpan);
    });

    document.getElementById("counter").textContent = `Visitors online: ${snapshot.numChildren()}`;
  });
}



visitorsRef.on('value', renderVisitors);

button.addEventListener("click", () => {
  sealSound.currentTime = 0;
  sealSound.play();
  incrementCounter();

  const userClickRef = userClicksRef.child(userId);
  userClickRef.transaction(current => (current || 0) + 1);
});

animate();

const chatInput = document.getElementById("chat-input");
const chatSend = document.getElementById("chat-send");
chatRef.on("child_added", (snapshot) => {
  const msg = snapshot.val();
  if (!msg) return;

  const visitorEl = document.getElementById(`visitor-${msg.userId}`);
  if (!visitorEl) return;

  const bubble = document.createElement("div");
  bubble.textContent = msg.text;
  bubble.className = "chat-bubble"; // style with CSS
  visitorEl.appendChild(bubble);

  // Fade bubble locally, but don't remove from DB yet
  setTimeout(() => {
    bubble.style.opacity = "0";
    setTimeout(() => bubble.remove(), 1000);
  }, 5000);
});

// Periodic cleanup: remove messages older than 30s
setInterval(() => {
  const cutoff = Date.now() - 30000;
  chatRef.orderByChild("timestamp").endAt(cutoff).once("value", snap => {
    snap.forEach(child => child.ref.remove());
  });
}, 10000);

chatSend.addEventListener("click", () => {
  const text = chatInput.value.trim();
  if (!text) return;

  chatRef.push({
    userId,
    text,
    timestamp: firebase.database.ServerValue.TIMESTAMP
  });

  chatInput.value = "";
});

      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
