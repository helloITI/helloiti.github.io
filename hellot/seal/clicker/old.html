  <!-- firebase + easter egg + counter -->
  <script>
    let easterEggActive = false;
    let resetTimeout = null;
    let shockSound = new Audio("https://helloiti.github.io/hellot/seal/clicker/miscassets/wii-sports-bowling-strike.mp3");

    const secretCode = "wiisports";
    let typedKeys = "";

    window.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      if (/^[a-z]$/.test(key)) {
        typedKeys += key;
        if (typedKeys.length > secretCode.length) {
          typedKeys = typedKeys.slice(-secretCode.length);
        }
        if (typedKeys === secretCode && !easterEggActive) {
          triggerEasterEgg();
        }
      }
    });

    const [_a,_b,_c,_d,_e,_f,_g,_h] = ["QUl6YVN5Q0YyTmMzZWhyaFZkMXNBSjdwS3lJTGhEZHlCRy1iVXZN","b2xkc2VhbGNsLmZpcmViYXNlYXBwLmNvbQ","aHR0cHM6Ly9vbGRzZWFsY2wtZGVmYXVsdC1ydGRiLmV1cm9wZS13ZXN0MS5maXJlYmFzZWRhdGFiYXNlLmFwcA","b2xkc2VhbGNs","b2xkc2VhbGNsLmZpcmViYXNlc3RvcmFnZS5hcHA","NjMzMDcyMzU0MjI2","MTY2MzMwNzIzNTQyMjY6d2ViOjI3ZTk3YzUzY2JjMTgwNmVmMTVhYWI","Ry02WUdSNzZHUkYw"].map(atob);
    const firebaseConfig = {apiKey:_a,authDomain:_b,databaseURL:_c,projectId:_d,storageBucket:_e,messagingSenderId:_f,appId:_g,measurementId:_h};
    firebase.initializeApp(firebaseConfig);
    const authReady = new Promise(resolve => {
      firebase.auth().onAuthStateChanged(user => {
        if (user) resolve(user);
      });
    });
    firebase.auth().signInAnonymously();
    const db = firebase.database();

    function triggerEasterEgg() {
      if (!model || easterEggActive) return;
      easterEggActive = true;
      shockSound.currentTime = 0;
      shockSound.play();
      model.userData.originalPos = model.position.clone();
      model.userData.originalRot = model.rotation.clone();
      gsap.to(model.position, { z: 20, duration: 0.7, ease: "power2.out" });
      setTimeout(shockCrowd, 100);
    }

    function shockCrowd() {
      personGroups.forEach((p) => {
        gsap.to(p.rotation, { x: -Math.PI/2, duration: 0.6, ease: "back.out(1)" });
      });
      resetTimeout = setTimeout(resetEasterEgg, 3000);
    }

    function resetEasterEgg() {
      if (model) {
        gsap.to(model.position, { x: 0, y: 0, z: 0, duration: 1, ease: "power2.inOut" });
      }
      personGroups.forEach((p) => {
        gsap.to(p.rotation, { x: 0, y: 0, z: 0, duration: 1, ease: "power2.inOut" });
      });
      easterEggActive = false;
    }

    // music - defined here so audioCtx below can reference it safely
    const musicList = [
      "https://helloiti.github.io/assets/07main.mp3",
      "https://helloiti.github.io/assets/mii.mp3",
      "https://helloiti.github.io/assets/13._Exhibition.mp3"
    ];
    const bgMusic = document.getElementById('bg-music');
    const bgSource = document.getElementById('bg-source');
    bgSource.src = musicList[Math.floor(Math.random() * musicList.length)];
    bgMusic.load();

    const sealSound = document.getElementById('seal-sound');
    const button = document.getElementById('seal-btn');
    const counterDiv = document.getElementById('counter');

    const clickCounterRef = firebase.database().ref("totalClicks");
    clickCounterRef.on("value", snap => {
      counterDiv.textContent = (snap.val() ?? 0) + " clicks";
    });

    function incrementCounter() {
      clickCounterRef.transaction(current => (current || 0) + 1);
    }
  </script>

  <!-- three.js scene -->
  <script>
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.5, 5);

    scene.add(new THREE.AmbientLight(0xffffff, 2));
    scene.add(new THREE.DirectionalLight(0xffffff, 3));

    const loader = new THREE.GLTFLoader();
    let model = null;
    let swingGroup, spinGroup;

    loader.load("https://helloiti.github.io/assets/models/seal/seal.gltf", (gltf) => {
      model = gltf.scene;
      model.traverse((child) => {
        if (child.isMesh) {
          const oldMat = child.material;
          child.material = new THREE.MeshStandardMaterial({
            map: oldMat.map,
            color: 0xffffff,
            side: THREE.DoubleSide,
            metalness: 0.2,
            roughness: 1
          });
          if (child.geometry && child.geometry.attributes.normal) {
            child.geometry.computeVertexNormals();
          }
        }
      });
      swingGroup = new THREE.Group();
      spinGroup = new THREE.Group();
      scene.add(spinGroup);
      spinGroup.add(swingGroup);
      swingGroup.add(model);
      model.rotation.y = -Math.PI / 2;
    });

    // audioCtx defined AFTER bgMusic is set up
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const audioSource = audioCtx.createMediaElementSource(bgMusic);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    audioSource.connect(analyser);
    analyser.connect(audioCtx.destination);
    document.body.addEventListener("click", () => { if (audioCtx.state === "suspended") audioCtx.resume(); });

    let clock = new THREE.Clock();
    let clickTimes = [];
    const CLICK_THRESHOLD = 5;
    const TIME_WINDOW = 1000;
    let hyperMode = false;

    let personGroups = [];

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      if (model && spinGroup && swingGroup) {
        if (!easterEggActive) {
          spinGroup.rotation.y += 0.04;
          if (hyperMode) {
            swingGroup.rotation.z = Math.sin(elapsed * 4) * 0.5;
            swingGroup.position.y = Math.cos(elapsed * 8) * 0.4;
            spinGroup.rotation.y += 0.001;
          } else {
            swingGroup.rotation.z = 0;
            swingGroup.position.y = 0;
          }
        } else {
          spinGroup.rotation.y = Math.PI;
          swingGroup.rotation.set(0, 0, 0);
        }
      }

      const now = Date.now();
      if (hyperMode && (clickTimes.length === 0 || now - clickTimes[clickTimes.length - 1] > TIME_WINDOW)) {
        hyperMode = false;
      }

      animateCrowd(elapsed);
      renderer.render(scene, camera);
    }

    function animateCrowd(elapsed) {
      if (!personGroups || personGroups.length === 0) return;

      if (hyperMode) {
        if (Math.random() < 0.03) {
          const person = personGroups[Math.floor(Math.random() * personGroups.length)];
          const emojiChar = emojiList[Math.floor(Math.random() * emojiList.length)];
          const sprite = createEmojiSprite(emojiChar);
          sprite.position.set(
            person.position.x + (Math.random() - 0.5) * 0.1,
            person.position.y + 0.8 + Math.random() * 0.2,
            person.position.z + (Math.random() - 0.5) * 0.1
          );
          emojiSprites.push({
            sprite,
            velocityY: Math.random() * 0.02 + 0.01,
            scaleUp: 0.002,
            swayOffset: Math.random() * Math.PI * 2
          });
          scene.add(sprite);
        }
      }

      for (let i = emojiSprites.length - 1; i >= 0; i--) {
        const e = emojiSprites[i];
        e.sprite.position.y += e.velocityY;
        e.sprite.position.x += Math.sin(clock.getElapsedTime() * 4 + e.swayOffset) * 0.001;
        e.sprite.scale.x += e.scaleUp;
        e.sprite.scale.y += e.scaleUp;
        e.sprite.material.opacity = Math.max(0, e.sprite.material.opacity - 0.01);
        if (e.sprite.material.opacity <= 0) {
          scene.remove(e.sprite);
          emojiSprites.splice(i, 1);
        }
      }

      personGroups.forEach((personGroup) => {
        personGroup.position.y = Math.sin(elapsed * 3 + personGroup.userData.bobOffset) * 0.05;
      });
    }

    const emojiList = ["👍","🎉","❤️","😂","🔥"];
    const emojiSprites = [];

    function createEmojiSprite(char) {
      const c = document.createElement("canvas");
      c.width = 128; c.height = 128;
      const ctx = c.getContext("2d");
      ctx.font = "100px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(char, 64, 64);
      const texture = new THREE.CanvasTexture(c);
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
      return new THREE.Sprite(material);
    }

    async function initCrowd() {
      const response = await fetch(
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vTaRidRwSGBHgsXxGZBpybxfgVKRnbgwJOCFcKdCneW8PWCc43VZh3H2INsmtpXm0UJ9lKYYzI6IuiF/pub?output=csv"
      );
      const text = await response.text();
      const rows = text.split("\n").filter(r => r.trim() !== "");
      const dataRows = rows.slice(1);
      const crowdGroup = new THREE.Group();
      scene.add(crowdGroup);

      const radius = 9;
      const texLoader = new THREE.TextureLoader();
      const loadedMiis = new Set();
      const uniqueRows = dataRows.filter(row => {
        const match = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
        if (!match) return false;
        const cols = match.map(c => c.replace(/^"|"$/g, '').trim());
        const miiId = cols[1];
        if (!miiId || loadedMiis.has(miiId)) return false;
        loadedMiis.add(miiId);
        return true;
      });

      const total = uniqueRows.length;
      for (let i = 0; i < total; i++) {
        const row = uniqueRows[i];
        const match = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
        if (!match) continue;
        const cols = match.map(c => c.replace(/^"|"$/g, '').trim());
        const miiId = cols[1];
        const personGroup = new THREE.Group();
        let body, top;
        const bodyColor = new THREE.Color().setHSL(Math.random(), 0.7, 0.5);

        if (miiId) {
          try {
            const jsonRes = await fetch(`https://mii-unsecure.ariankordi.net/miitomo_get_player_data/${miiId}?namespace=own_mii`);
            const jsonData = await jsonRes.json();
            const gender = jsonData.players[0].player_data.own_mii.gender;

            if (gender === 1) {
              const bodyHeight = 0.3, bodyRadius = 0.08;
              body = new THREE.Mesh(new THREE.CylinderGeometry(bodyRadius, bodyRadius, bodyHeight, 16), new THREE.MeshStandardMaterial({ color: bodyColor }));
              body.position.y = bodyHeight / 2;
              top = new THREE.Mesh(new THREE.SphereGeometry(bodyRadius, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: bodyColor }));
              top.position.y = bodyHeight;
              const bodyDress = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.35, 16), new THREE.MeshStandardMaterial({ color: bodyColor }));
              bodyDress.position.y = -(0.35 / 2) + 0.35;
              personGroup.add(bodyDress);
            } else {
              const bodyHeight = 0.3, bodyRadius = 0.08;
              body = new THREE.Mesh(new THREE.CylinderGeometry(bodyRadius, bodyRadius, bodyHeight, 16), new THREE.MeshStandardMaterial({ color: bodyColor }));
              body.position.y = bodyHeight / 2;
              top = new THREE.Mesh(new THREE.SphereGeometry(bodyRadius, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: bodyColor }));
              top.position.y = bodyHeight;
            }

            const nxData = jsonData.players[0].player_data.own_mii.nx_mii_core_data;
            const texture = texLoader.load(`https://mii-unsecure.ariankordi.net/miis/image.png?&data=${nxData}&type=face_only&width=40`);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
            sprite.scale.set(0.56, 0.56, 1);
            sprite.position.y = 0.6;
            sprite.position.z = 0.015;
            personGroup.add(sprite);
          } catch (err) {
            console.error("Failed to load Mii:", miiId, err);
          }
        }

        if (body && top) { personGroup.add(body); personGroup.add(top); }

        const angle = ((i - (total - 1) / 2) / total) * Math.PI / 2;
        personGroup.position.set(radius * Math.sin(angle), 0, -radius * Math.cos(angle) + 5);
        personGroup.userData = { swayOffset: Math.random() * Math.PI * 2, bobOffset: Math.random() * Math.PI * 2 };
        crowdGroup.add(personGroup);
        personGroups.push(personGroup);
      }
    }

    initCrowd();
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

  <!-- firebase visitors + chat + single click handler -->
  <script>
    const visitorListDiv = document.getElementById("visitor-list");
    const visitorsRef = firebase.database().ref("onlineUsers");
    const userClicksRef = firebase.database().ref("userClicks");
    const chatRef = firebase.database().ref("chatMessages");

    let userId = localStorage.getItem("useridentifier");
    let isGuest = false;
    if (!userId) {
      isGuest = true;
      userId = "guest_" + Math.random().toString(36).substr(2, 9);
      localStorage.setItem("useridentifier", userId);
    }

    const thisVisitorRef = visitorsRef.child(userId);

    function addOrUpdateVisitor(username = null) {
      thisVisitorRef.update({
        id: userId,
        guest: isGuest,
        username: username || userId,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      }).catch(err => console.error("Failed to add/update visitor:", err));
      thisVisitorRef.onDisconnect().remove().catch(err => console.error("onDisconnect failed:", err));
    }

    firebase.database().ref('.info/connected').on('value', snap => {
      if (snap.val() === true) {
        if (!isGuest) {
          fetch(`https://mii-unsecure.ariankordi.net/miitomo_get_player_data/${userId}?namespace=own_mii`)
            .then(res => res.json())
            .then(data => {
              const player = data.players?.[0]?.player_data?.own_mii;
              addOrUpdateVisitor(player?.nameExtension || userId);
            })
            .catch(() => addOrUpdateVisitor());
        } else {
          addOrUpdateVisitor();
        }
      }
    });

    setInterval(() => {
      thisVisitorRef.update({ timestamp: firebase.database.ServerValue.TIMESTAMP });
    }, 10000);

    visitorsRef.on('value', snapshot => {
      const now = Date.now();
      snapshot.forEach(childSnap => {
        const visitor = childSnap.val();
        if (visitor && visitor.timestamp && now - visitor.timestamp > 30000) {
          visitorsRef.child(visitor.id).remove();
        }
      });
    });

    function renderVisitors(snapshot) {
      visitorListDiv.innerHTML = "";
      const visitors = [];
      snapshot.forEach(childSnap => {
        const visitor = childSnap.val();
        if (visitor && visitor.id) visitors.push(visitor);
      });

      const clickPromises = visitors.map(visitor =>
        userClicksRef.child(visitor.id).get().then(snap => ({ ...visitor, clicks: snap.val() || 0 }))
      );

      Promise.all(clickPromises).then(visitorsWithClicks => {
        visitorsWithClicks.sort((a, b) => b.clicks - a.clicks);
        visitorsWithClicks.forEach((visitor, index) => {
          let visitorDiv = document.getElementById(`visitor-${visitor.id}`);
          if (!visitorDiv) {
            visitorDiv = document.createElement("div");
            visitorDiv.id = `visitor-${visitor.id}`;
            visitorDiv.style.cssText = "display:flex;align-items:center;margin-bottom:5px;position:relative;z-index:3;";
            const bubbleLayer = document.createElement("div");
            bubbleLayer.className = "bubble-layer";
            bubbleLayer.style.cssText = "position:absolute;left:60px;top:-5px;";
            visitorDiv.appendChild(bubbleLayer);
            visitorListDiv.appendChild(visitorDiv);
          } else {
            Array.from(visitorDiv.children).forEach(child => {
              if (!child.classList.contains("bubble-layer")) child.remove();
            });
          }

          const img = document.createElement("img");
          img.width = 50; img.height = 50;
          img.style.cssText = "border-radius:50%;margin-right:8px;";
          img.src = visitor.guest ? "https://helloiti.github.io/assets/anonface.png" : `https://tomop.kaeru.world/miiface/${visitor.id}`;
          img.onerror = () => { img.src = "anonface.png"; };

          const infoSpan = document.createElement("span");
          infoSpan.style.cssText = "display:flex;flex-direction:column;";

          const nameSpan = document.createElement("span");
          nameSpan.textContent = (visitor.guest ? visitor.id : visitor.username || visitor.id) + (index === 0 ? " 👑" : "");
          if (visitor.id === userId) { nameSpan.style.color = "white"; nameSpan.style.fontWeight = "bold"; }

          const clicksSpan = document.createElement("span");
          clicksSpan.style.cssText = "font-size:0.9em;color:#00ff00;";
          clicksSpan.textContent = `Clicks: ${visitor.clicks}`;
          userClicksRef.child(visitor.id).on("value", snap => {
            clicksSpan.textContent = `Clicks: ${snap.val() || 0}`;
          });

          infoSpan.appendChild(nameSpan);
          infoSpan.appendChild(clicksSpan);
          visitorDiv.appendChild(img);
          visitorDiv.appendChild(infoSpan);
        });

        document.getElementById("visitor-counter").textContent = `Visitors online: ${snapshot.numChildren()}`;
      });
    }

    visitorsRef.on('value', renderVisitors);

    // SINGLE unified click handler
    button.addEventListener("click", () => {
      sealSound.currentTime = 0;
      sealSound.play();

      const lang = langSelector.value;
      const t = translations[lang];
      document.getElementById('click-message').textContent =
        t.messages[Math.floor(Math.random() * t.messages.length)];

      // hyperMode tracking
      const now = Date.now();
      clickTimes.push(now);
      clickTimes = clickTimes.filter(t => now - t < TIME_WINDOW);
      if (clickTimes.length >= CLICK_THRESHOLD) hyperMode = true;

      // wait for auth before any Firebase writes
      authReady.then(() => {
        incrementCounter();
        const userClickRef = userClicksRef.child(userId);
        userClickRef.transaction(current => (current || 0) + 1);
      });
    });

    // chat
    const chatInput = document.getElementById("chat-input");
    const chatSend = document.getElementById("chat-send");

    chatRef.on("child_added", (snapshot) => {
      const msg = snapshot.val();
      if (!msg) return;
      const visitorEl = document.getElementById(`visitor-${msg.userId}`);
      if (!visitorEl) return;
      const bubble = document.createElement("div");
      bubble.textContent = msg.text;
      bubble.className = "chat-bubble";
      visitorEl.appendChild(bubble);
      setTimeout(() => {
        bubble.style.opacity = "0";
        setTimeout(() => bubble.remove(), 1000);
      }, 5000);
    });

    setInterval(() => {
      const cutoff = Date.now() - 30000;
      chatRef.orderByChild("timestamp").endAt(cutoff).once("value", snap => {
        snap.forEach(child => child.ref.remove());
      });
    }, 10000);

    chatSend.addEventListener("click", () => {
      const text = chatInput.value.trim();
      if (!text) return;
      chatRef.push({ userId, text, timestamp: firebase.database.ServerValue.TIMESTAMP });
      chatInput.value = "";
    });
  </script>
</body>
</html>
