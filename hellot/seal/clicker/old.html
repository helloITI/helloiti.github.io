<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>seal of HelloT</title>
<link rel="stylesheet" href="css.css">
</head>
<body>
  <div id="mii-modal-overlay" style="display:none;">
    <div id="mii-modal">
      <h2>※ Show your own Mii! ※</h2>
      <p>Paste your Mii's hex data below to use it as your face here. You can come back and change this anytime with the "Change my Mii" button.</p>
      <textarea id="mii-modal-input" placeholder="Paste Mii HEX data here..."></textarea>
      <div id="mii-modal-error"></div>
      <div class="mii-modal-buttons">
        <button id="mii-modal-remove">Remove my Mii</button>
        <button id="mii-modal-skip">Skip</button>
        <button id="mii-modal-save">Save</button>
      </div>
    </div>
  </div>
<h1></h1>
<button id="mii-edit-btn">Change my Mii</button><select id="lang-selector"><option value="en">English</option><option value="es">Español</option><option value="fi">Suomi</option><option value="fr">Français</option></select>
<div id="visitor-list" style="position:relative;z-index:10;pointer-events:none;"></div>
<input id="chat-input" type="text" placeholder="Say something..." style="width:10%; position:relative; z-index:10;">
<button id="chat-send" style="position:relative; z-index:10;">Send</button>
  <canvas id="canvas"></canvas>
  <p id="click-message"></p>
  <div id="counter">Loading...</div>
  <div id="visitor-counter" style="position:absolute;bottom:50px;left:50%;transform:translateX(-50%);font-size:16px;color:#fff;z-index:10;"></div>
  <button id="seal-btn"></button>
<audio id="seal-sound"><source src="https://helloiti.github.io/assets/0042.mp3" type="audio/mpeg"></audio>
<audio id="bg-music" autoplay loop><source id="bg-source" type="audio/mpeg"></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script><script src="translations.js"></script><script src="fire.js"></script><script src="js.js"></script><script src="test.js"></script>
</body>
</html>
