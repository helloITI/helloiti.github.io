<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Avatar Character</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <meta property="og:title" content="My Avatar Editor" />
  <meta property="og:description" content="Create and edit personalized avatar characters compatible with Mii™ characters found on the Nintendo® Wii™" />
  <meta property="og:url" content="https://helloiti.github.io/mae/" />
  <meta property="og:image" content="https://helloiti.github.io/mae/favicon.png" />
  <meta property="og:type" content="website" />
<link rel="stylesheet" href="styles/show.css">
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <!-- SWFObject -->
  <script src="https://helloiti.github.io/mae/scripts/swfobject.js"></script>
  <script src="https://helloiti.github.io/mae/scripts/utils.js"></script>
  <script>
    // ok
  window.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);
  const mii = params.get("mii") || params.get("avatar") || params.get("wii");
  const queryObj = getQueryObj();
  if (mii) {
    queryObj.mii = mii;
  }
  swfobject.embedSWF(
    "myavatarshow.swf",
    "avatarSWFContainer",
    "100%",
    "100%",
    "10.0.0",
    null,
    queryObj
  );
});
  </script>
</head>
<body>
  <div id="avatarSWFContainer">
<h3>Flash Player 10 is required (you have <script type="text/javascript">document.write(swfobject.getFlashPlayerVersion() || "(unknown)");</script>).</h3>
		<p><a href="https://archive.org/details/adobeflash-10_1"><img src="https://helloiti.github.io/mae/images/shared/download_buttons/get_flash_player.png" alt="Get Adobe Flash player" border="0"/></a></p>
    <a href="https://helloiti.github.io/mae" style="position: absolute; top: 10px; right: 10px; color: black !important; font-size: 12px; text-decoration: none; background: none !important; -webkit-text-fill-color: black !important;">Go Back?</a>
  </div>
</body>
</html>
