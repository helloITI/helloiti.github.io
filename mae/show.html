<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="robots" content="noindex, nofollow, noai, noimageai">
  <meta name="darkreader-lock" content="">
  <title>My Avatar Character</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <meta property="og:title" content="My Avatar Editor" />
  <meta property="og:description" content="Create and edit personalized avatar characters compatible with Mii™ characters found on the Nintendo® Wii™" />
  <meta property="og:url" content="https://helloiti.github.io/mae/" />
  <meta property="og:image" content="https://helloiti.github.io/mae/favicon.png" />
  <meta property="og:type" content="website" />
<link rel="stylesheet" href="https://helloiti.github.io/mae/styles/show.css">
  <script type="text/javascript" src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <!-- SWFObject -->
  <script type="text/javascript" src="/mae/scripts/swfobject.js"></script>
  <script type="text/javascript" src="/mae/scripts/utils.js"></script>
<script type="text/javascript">
  window.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);

    let saved = null;
    try { saved = localStorage.getItem("avatar"); } catch (e) {}

    const mii = params.get("mii") || params.get("avatar") || params.get("wii") || params.get("mae") || saved;

    const queryObj = getQueryObj();
    if (mii) {
      queryObj.mii = mii;
      queryObj.avatar = mii;
      queryObj.wii = mii;
    }

    swfobject.embedSWF(
      "/mae/myavatarshow.swf", // "myavatarshow.swf" is a custom edited SWF of "myavatarcharacter.swf", it's only used for this page.
      "avatarSWFContainer",
      "100%",
      "100%",
      "10.0.0",
      null,
      queryObj
    );
  });
</script>
</head>
<body>
  <div id="avatarSWFContainer">
<h3 style="color: black !important;">Flash Player 10 is required (you have <script type="text/javascript">document.write(swfobject.getFlashPlayerVersion() || "(unknown)");</script>).</h3>
	<p><a href="https://archive.org/details/adobeflash-10_1"><img src="https://helloiti.github.io/mae/images/shared/download_buttons/get_flash_player.png" alt="Get Adobe Flash player" title="Get Adobe Flash player" border="0"/></a></p>
    <a href="https://helloiti.github.io/mae/" style="position: absolute; top: 10px; right: 10px; color: black !important; font-size: 12px; text-decoration: none; background: none !important; -webkit-text-fill-color: black !important;">Go Back?</a>
  </div>
</body>
</html>
