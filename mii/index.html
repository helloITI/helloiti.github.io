<!doctype html>
<html lang="en">
<head>
    <title>Mii Storage</title>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow, noai, noimageai">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="darkreader-lock" content="">

    <meta property="og:title" content="Mii Storage" />
    <meta property="og:description" content="Mii Storage is a tool that lets you upload CHARINFO, FFSD or MNMS Miis and saves them in your browser!" />
    <meta property="og:url" content="https://helloiti.github.io/mii/" />
    <meta property="og:image" content="https://helloiti.github.io/assets/miiST.png" />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/png" href="https://helloiti.github.io/assets/miiST.png"> <link rel="stylesheet" href="css.css"> <script src="js.js" defer></script>
</head>
<body>

    <a href="https://helloiti.github.io/home" id="mw" style="position:absolute; top:10px; right:10px; font-size:13px; text-decoration:none;">Go Back?</a>

<center>
  <h1>Welcome to Mii Storage!</h1>
  <h3>Here, you can save your CHARINFO, FFSD, and MNMS Miis right in your browser!</h3>
  <p class="or"><i class="or">Isn't that cool?</i></p><br><br>

        <p class="or" style="font-size:13px;">Drop a CHARINFO, FFSD, or MNMS file below!</p>
        <input type="file" id="fl" accept=".charinfo,.ffsd,.mnms"><br><br>
        
        <p class="or">Or...</p>
        <h3>You can also import your raw Mii HEX data!</h3>
        <h4><i></i></h4>

        <textarea id="hx" placeholder="Paste your CHARINFO, FFSD or MNMS' HEX data here..." style="width:500px; height:100px; margin:5px; font-family:monospace; resize:none; user-select:text; pointer-events:auto;"></textarea><br>

        <button id="ih" style="max-width:100% !important; height:auto !important; border-radius:8px !important;">Import</button>
</center>
    
    <center><h2>Saved Miis:</h2></center>

    <div id="ls"></div>

    <!-- mii full body modal -->
    <div id="mp">
        <div class="pp">
            <img id="pi" style="max-width:100%; height:auto; border-radius:8px;"><br>
            <button onclick="document.getElementById('mp').style.display='none'">※ Close ※</button>
        </div>
    </div>

    <!-- extra modals -->
    <div id="mp1"><div class="pp" id="pt"></div></div>
    <div id="mp2"><div class="pp" id="cr"></div></div>
    <div id="mp3"><div class="pp" id="fqc"></div></div>
    
    <!-- buttons -->
    <button id="gi" onclick="sg()">Credits</button>
    <button id="fq" onclick="sfq()">FAQ</button>
    <button id="dl">※ Dark Mode ※</button>

<img src="https://helloiti.github.io/assets/seal.gif" class="seal" title="helloT seal" alt="helloT seal" style="image-rendering:smooth; object-fit: contain;">
    
<audio id="bg" loop><source src="https://helloiti.github.io/assets/dwnmng.mp3" type="audio/mpeg"></audio>
</body>  </html>
