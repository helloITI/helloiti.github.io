<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>※ Paint Account ※</title>
<link rel="icon" type="image/png" href="https://helloiti.github.io/assets/paint.png">
<link rel="stylesheet" href=".css">
</head>
<body>
<h2>※ Log in your Paint Account! ※</h2>
<div class="card" id="lCD">
  <input id="liUS" placeholder="username">
  <input id="liPA" type="password" placeholder="password">
  <label><input type="checkbox" id="liSP">Show password</label>
  <button id="btnLG">Login</button>
  <div id="lMsg"></div>
</div>
<p>※ Don't have an account yet? Click <span class="link" id="sSUP">here</span> to make one! :D ※</p>
<div class="card" id="sCD style="display:none;">
  <input id="suUS" placeholder="username">
  <input id="suPA" type="password" placeholder="password">
  <input id="suCOPA" type="password" placeholder="password">
  <label><input type="checkbox" id="suShowPass">Show password</label>
  <button id="btnSUP">Register</button>
  <div id="sMsg"></div>
</div>
<p id="sLG" style="display:none;">※ Already have an account? click <span class="link" id="sLGL">here</span> to log in! :D ※</p>
<div class="card" id="accountCard" style="display:none;">
  <p id="accountInfo"></p>
  <button id="btnLT">Logout</button>
</div>
<script type="module" src=".js"></script>
<audio id="bgm" loop>
  <source src="https://helloiti.github.io/assets/psvita.mp3" type="audio/mpeg">
</audio>
</body>
</html>
