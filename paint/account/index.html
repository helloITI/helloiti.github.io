<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>※⁜ paint account ⁜※</title>
<link rel="icon" type="image/png" href="https://helloiti.github.io/assets/paint.png">
<link rel="stylesheet" href=".css">
</head>
<body>
<h2>※ Log in your Paint Account! ※</h2>
<div class="card" id="loginCard">
  <input id="liUsername" placeholder="username">
  <input id="liPassword" type="password" placeholder="password">
  <label><input type="checkbox" id="liShowPass">Show password</label>
  <button id="btnLogin">Login</button>
  <div id="loginMsg"></div>
</div>
<p>※ Don't have an account yet? Click <span class="link" id="showSignup">here</span> to make one! :D ※</p>
<div class="card" id="signupCard" style="display:none;">
  <input id="suUsername" placeholder="username">
  <input id="suPassword" type="password" placeholder="password">
  <input id="suConfirmPassword" type="password" placeholder="password">
  <label><input type="checkbox" id="suShowPass">Show password</label>
  <button id="btnSignUp">Register</button>
  <div id="signupMsg"></div>
</div>
<p id="showLogin" style="display:none;">※ Already have an account? click <span class="link" id="showLoginLink">here</span> to log in! :D ※</p>
<div class="card" id="accountCard" style="display:none;">
  <p id="accountInfo"></p>
  <button id="btnLogout">Logout</button>
</div>
<script type="module" src=".js"></script>
<audio id="bgm" loop>
  <source src="https://hellot.nekoweb.org/assets/psvita.mp3" type="audio/mpeg">
</audio>
</body>
</html>
